; MeshBBS firmware – builds against ../../MeshCore-upstream as a library (its build_as_lib.py),
; with MC_VARIANT selecting the board pin map from MeshCore's variants/ directory.
[platformio]
default_envs = Heltec_v3_bbs
boards_dir = ${PROJECT_DIR}/../../MeshCore-upstream/boards

[bbs_common]
platform = platformio/espressif32@6.11.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = ${PROJECT_DIR}/../../MeshCore-upstream/merge-bin.py
lib_deps =
  symlink://../../MeshCore-upstream
  symlink://../../MeshCore-upstream/arch/esp32/AsyncElegantOTA
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  SPI
  Wire
  jgromes/RadioLib @ ^7.6.0
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit GFX Library @ ^1.11.11
; ed25519 lives in MeshCore's lib/ without a manifest, so it is compiled as project source via lib/ed25519 symlink
build_src_filter = +<*.cpp> +<../../core/*.cpp> +<../lib/ed25519/*.c>
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D ESP32_PLATFORM
  -D ESP32_CPU_FREQ=80
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D DISPLAY_CLASS=SSD1306Display
  -I ${PROJECT_DIR}/../core
  -I ${PROJECT_DIR}/../../MeshCore-upstream/lib/ed25519
  ; --- BBS identity: change these ---
  -D ADVERT_NAME='"MeshBBS"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  ; -D BBS_ANNOUNCE_LOGINS=0

; ---------------- Heltec WiFi LoRa 32 V3 ----------------
[env:Heltec_v3_bbs]
extends = bbs_common
board = esp32-s3-devkitc-1
build_flags =
  ${bbs_common.build_flags}
  -D MC_VARIANT=heltec_v3
  -I ${PROJECT_DIR}/../../MeshCore-upstream/variants/heltec_v3
  -D HELTEC_LORA_V3
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=35
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36

; ---------------- Heltec WiFi LoRa 32 V4 (OLED) ----------------
[env:Heltec_v4_bbs]
extends = bbs_common
board = heltec_v4
build_flags =
  ${bbs_common.build_flags}
  -D MC_VARIANT=heltec_v4
  -I ${PROJECT_DIR}/../../MeshCore-upstream/variants/heltec_v4
  -D HELTEC_LORA_V4
  -D HELTEC_LORA_V4_OLED
  -D P_LORA_TX_LED=35
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_PA_POWER=7
  -D P_LORA_GC1109_PA_EN=2
  -D P_LORA_GC1109_PA_TX_EN=46
  -D P_LORA_KCT8103L_PA_CSD=2
  -D P_LORA_KCT8103L_PA_CTX=5
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D LORA_TX_POWER=10
  -D MAX_LORA_TX_POWER=22
  -D SX126X_REGISTER_PATCH=1
  -D PIN_ADC_CTRL=37
  -D PIN_VBAT_READ=1
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
