name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  # MeshCore commit the firmware is built against (see firmware/src/NOTICE.md)
  MESHCORE_REF: c940ea5f305df87c4ea215d74e522b64c22c66e9

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run engine tests
        run: make -C host test

  firmware:
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - name: Checkout meshbbs
        uses: actions/checkout@v4
        with:
          path: meshbbs

      - name: Checkout MeshCore
        uses: actions/checkout@v4
        with:
          repository: meshcore-dev/MeshCore
          ref: ${{ env.MESHCORE_REF }}
          path: MeshCore-upstream

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('meshbbs/firmware/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Version string
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then V="${GITHUB_REF#refs/tags/}"; else V="dev-$(git -C meshbbs rev-parse --short HEAD)"; fi
          echo "BBS_VERSION=$V" >> $GITHUB_ENV
          echo "BBS_DATE=$(date '+%d-%b-%Y')" >> $GITHUB_ENV

      - name: Build Heltec_v3_bbs
        working-directory: meshbbs/firmware
        env:
          PLATFORMIO_BUILD_FLAGS: -D FIRMWARE_VERSION='"${{ env.BBS_VERSION }}"' -D FIRMWARE_BUILD_DATE='"${{ env.BBS_DATE }}"'
        run: pio run -e Heltec_v3_bbs -t mergebin

      - name: Collect binaries
        run: |
          mkdir -p out
          cp meshbbs/firmware/.pio/build/Heltec_v3_bbs/firmware-merged.bin "out/MeshBBS_Heltec_v3-${BBS_VERSION}-merged.bin"
          cp meshbbs/firmware/.pio/build/Heltec_v3_bbs/firmware.bin        "out/MeshBBS_Heltec_v3-${BBS_VERSION}-app.bin"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MeshBBS_Heltec_v3-${{ env.BBS_VERSION }}
          path: out

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: MeshBBS ${{ env.BBS_VERSION }}
          draft: true
          files: out/*
